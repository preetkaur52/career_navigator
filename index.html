<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Navigator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --card:rgba(15,23,42,0.6);
  --accent:#3b82f6;
  --accent2:#22c55e;
  --text:#e2e8f0;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* Animated gradient background */
body::before{
  content:"";
  position:fixed;
  width:600px;height:600px;
  background:radial-gradient(circle,var(--accent),transparent);
  top:-200px;left:-200px;
  filter:blur(120px);
  animation:move 10s infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  width:500px;height:500px;
  background:radial-gradient(circle,var(--accent2),transparent);
  bottom:-200px;right:-200px;
  filter:blur(120px);
  animation:move 12s infinite alternate;
}

@keyframes move{
  to{transform:translate(100px,100px)}
}

/* Header */
header{
  backdrop-filter:blur(12px);
  background:rgba(2,6,23,0.6);
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:700;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

/* Container */
.container{
  text-align:center;
  padding:40px 20px;
}

h1{
  font-size:36px;
  margin-bottom:10px;
}

p{
  opacity:0.7;
}

/* Search bar */
.search{
  margin-top:20px;
}

.search input{
  padding:12px 15px;
  width:280px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:40px;
}

.card{
  padding:20px;
  border-radius:15px;
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  transition:0.3s;
  transform-style:preserve-3d;
}

.card:hover{
  transform:rotateY(5deg) scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

.card h3{
  color:var(--accent);
}

/* Button */
.btn{
  margin-top:15px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  background:#2563eb;
  transform:scale(1.05);
}

/* Floating action button */
.fab{
  position:fixed;
  bottom:20px;
  left:20px;
  background:var(--accent2);
  padding:12px 16px;
  border-radius:50px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<header>Career Navigator</header>

<div class="container">
  <h1>Find Your Dream Job 🚀</h1>
  <p>Search jobs instantly using AI</p>

  <div class="search">
    <input type="text" placeholder="e.g. Developer in Delhi" id="searchBox">
  </div>

  <div class="cards">
    <div class="card">
      <h3>IT Jobs</h3>
      <p>Developer, Data, Web roles</p>
      <button class="btn" onclick="sendQuery('IT jobs')">Explore</button>
    </div>

    <div class="card">
      <h3>Marketing</h3>
      <p>Digital & growth roles</p>
      <button class="btn" onclick="sendQuery('Marketing jobs')">Explore</button>
    </div>

    <div class="card">
      <h3>Finance</h3>
      <p>Accounting roles</p>
      <button class="btn" onclick="sendQuery('Finance jobs')">Explore</button>
    </div>
  </div>
</div>

<div class="fab" onclick="openChat()">💬 Chat</div>

<!-- Watson Assistant -->
<script>
window.watsonAssistantChatOptions = {
  integrationID: "ad7f0eaf-a9ac-433f-ae38-3ecd916a8a86",
  region: "eu-de",
  serviceInstanceID: "750bfe58-253b-4083-9046-27f97899422f",
  onLoad: async (instance) => {
    window.chat = instance;
    await instance.render();
  }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
  (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
  "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});

/* Interactions */
function openChat(){
  if(window.chat) window.chat.openWindow();
}

function sendQuery(text){
  if(window.chat){
    window.chat.openWindow();
    window.chat.send({ input: { text } });
  }
}

/* Search enter trigger */
document.getElementById("searchBox").addEventListener("keypress",function(e){
  if(e.key==="Enter"){
    sendQuery(this.value);
  }
});
</script>

</body>
</html>
